name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4   # installs the tools pinned in mise.toml (python, uv)
      - run: mise run setup        # uv sync --all-groups
      - run: mise run check        # lint + tests + notebook freshness
      - run: mise run notebooks:run  # execute every notebook
